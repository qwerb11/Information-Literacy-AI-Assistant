<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>信息素养 AI 学伴</title>
<style>
:root{--primary:#0f766e;--primary-dark:#115e59;--bg:#f1f5f9;--card:#fff;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--blue:#2563eb;--ok:#16a34a;--err:#dc2626;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:15px}
.wrap{max-width:960px;margin:0 auto;padding:0 12px 30px}
header{background:linear-gradient(135deg,#0f766e,#1e40af);color:#fff;padding:18px 0;margin-bottom:12px}
header .wrap{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{font-size:20px}
header p{font-size:12.5px;opacity:.85}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:6px;margin-bottom:14px;overflow-x:auto}
.tabs button{flex:1;min-width:80px;border:0;background:none;padding:9px 8px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button.active{background:var(--primary);color:#fff;font-weight:600}
section{display:none}
section.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h2{font-size:16px;margin-bottom:10px}
.note{font-size:12.5px;color:var(--muted);background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:10px}
.chatbox{display:flex;flex-direction:column;height:62vh;min-height:380px}
.messages{flex:1;overflow-y:auto;padding:6px 2px}
.msg{max-width:86%;margin-bottom:12px;padding:10px 13px;border-radius:12px;font-size:14.5px;word-break:break-word}
.msg.user{margin-left:auto;background:var(--blue);color:#fff;border-bottom-right-radius:3px}
.msg.ai{background:#f1f5f9;border:1px solid var(--border);border-bottom-left-radius:3px}
.msg.off{background:#fffbeb;border:1px solid #fde68a;border-bottom-left-radius:3px}
.msg.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.msg pre{background:#0f172a;color:#e2e8f0;padding:10px;border-radius:8px;overflow-x:auto;font-size:13px;margin:6px 0}
.msg code{background:#e2e8f0;border-radius:4px;padding:1px 5px;font-size:13px}
.msg pre code{background:none;padding:0}
.msg h4{margin:8px 0 4px}
.typing{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px}
.typing::after{content:'';width:6px;height:6px;background:var(--muted);border-radius:50%;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chips button{border:1px solid var(--border);background:#f8fafc;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:#334155}
.chips button:hover{border-color:var(--primary);color:var(--primary)}
.inputrow{display:flex;gap:8px;margin-top:10px}
.inputrow textarea{flex:1;border:1px solid var(--border);border-radius:10px;padding:10px;font-size:14.5px;resize:none;height:56px;font-family:inherit}
.inputrow button{border:0;background:var(--primary);color:#fff;border-radius:10px;padding:0 20px;cursor:pointer;font-size:15px}
.inputrow button:disabled{opacity:.5;cursor:not-allowed}
.mode{font-size:12px;font-weight:400;color:#fff;background:#16a34a;border-radius:999px;padding:2px 10px;margin-left:8px;vertical-align:middle}
.mode.off{background:#b45309}
.quizbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.catbtn{border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13.5px}
.catbtn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.modebtn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13.5px}
.modebtn.active{background:#e0f2fe;border-color:#7dd3fc;color:#0369a1;font-weight:600}
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:8px}
.qtext{font-size:16px;font-weight:600;margin-bottom:14px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--border);background:#fff;border-radius:10px;padding:11px 13px;font-size:14.5px;cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--primary)}
.opt .letter{display:inline-block;width:24px;height:24px;line-height:22px;text-align:center;border:1px solid var(--border);border-radius:50%;margin-right:8px;font-size:13px;color:var(--muted)}
.opt.correct{border-color:var(--ok);background:#f0fdf4}
.opt.correct .letter{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--err);background:#fef2f2}
.opt.wrong .letter{background:var(--err);border-color:var(--err);color:#fff}
.opt:disabled{cursor:default;opacity:.75}
.explain{margin-top:12px;padding:11px 13px;border-radius:10px;font-size:14px;display:none}
.explain.right{background:#f0fdf4;border:1px solid #bbf7d0;color:#14532d}
.explain.wrong{background:#fef2f2;border:1px solid #fecaca;color:#7f1d1d}
.ctrl{display:flex;gap:10px;margin-top:14px}
.ctrl button{border:0;border-radius:10px;padding:10px 22px;cursor:pointer;font-size:15px}
.btn-main{background:var(--primary);color:#fff}
.btn-ghost{background:#f1f5f9;border:1px solid var(--border)!important;color:#334155}
.summary{text-align:center;padding:26px 10px}
.summary .score{font-size:42px;font-weight:700;color:var(--primary)}
.review{margin-top:16px;text-align:left;font-size:14px}
.review .rq{border-top:1px dashed var(--border);padding:10px 0}
.review .okc{color:var(--ok);font-weight:600}
.review .badc{color:var(--err);font-weight:600}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.vcard{border:1px solid var(--border);border-radius:var(--radius);padding:14px;background:#fff;display:flex;flex-direction:column;gap:6px}
.vcard .tag{font-size:11.5px;color:#0369a1;background:#e0f2fe;border-radius:5px;padding:2px 8px;align-self:flex-start}
.vcard h3{font-size:14.5px;line-height:1.45}
.vcard .src{font-size:12.5px;color:var(--muted)}
.vcard .desc{font-size:12.8px;color:#475569;flex:1}
.vcard a{display:block;text-align:center;background:var(--primary);color:#fff;text-decoration:none;border-radius:8px;padding:8px;font-size:14px;margin-top:4px}
.vcard a:hover{background:var(--primary-dark)}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw}
.toast.show{opacity:1}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div>
      <h1>📚 信息素养 AI 学伴</h1>
      <p>面向高职高专学生 · 打开即用：AI 答疑 + 题库练习 + 微课资源</p>
    </div>
    <p>v6 已配置版</p>
  </div>
</header>
<div class="wrap">
  <nav class="tabs">
    <button class="tab-btn active" data-tab="chat">💬 AI 问答</button>
    <button class="tab-btn" data-tab="quiz">📝 题库练习</button>
    <button class="tab-btn" data-tab="video">🎬 视频课程</button>
  </nav>

  <section id="tab-chat" class="active">
    <div class="card">
      <h2>信息素养 AI 助教 <span class="mode" id="modeTag">…</span></h2>
      <div class="chips" id="quickChips">
        <button>什么是信息素养？</button>
        <button>怎么在知网查文献？</button>
        <button>参考文献格式怎么写？</button>
        <button>查出来的文献太多怎么办？</button>
        <button>下载论文要收费怎么办？</button>
      </div>
      <div class="chatbox">
        <div class="messages" id="messages"></div>
        <div class="inputrow">
          <textarea id="chatInput" placeholder="直接输入你的问题，Enter 发送"></textarea>
          <button id="sendBtn">发送</button>
        </div>
      </div>
      <div class="note">已配置智谱 GLM-4-Flash（免费），打开即可对话，无需任何设置；模型不可用或额度用尽时自动切换内置知识库回答。</div>
    </div>
  </section>

  <section id="tab-quiz">
    <div class="card">
      <h2>题库练习 <span style="font-size:12.5px;font-weight:400;color:var(--muted)" id="statsText"></span></h2>
      <div class="quizbar">
        <span style="font-size:13.5px;color:var(--muted)">分类：</span>
        <button class="catbtn active" data-cat="all">全部</button>
        <button class="catbtn" data-cat="base">信息素养基础</button>
        <button class="catbtn" data-cat="search">信息检索</button>
        <button class="catbtn" data-cat="lib">图书馆知识</button>
        <span style="font-size:13.5px;color:var(--muted);margin-left:8px">模式：</span>
        <button class="modebtn active" data-mode="seq">顺序练习</button>
        <button class="modebtn" data-mode="rand">随机测验(10题)</button>
        <button class="modebtn" data-mode="wrong">错题重练</button>
      </div>
      <div id="quizBody"></div>
    </div>
  </section>

  <section id="tab-video">
    <div class="card">
      <h2>视频课程 · 微课资源</h2>
      <p style="font-size:13px;color:var(--muted);margin-bottom:6px">以下为公开平台上的信息素养课程与微课，点击可直接打开观看（需联网）。</p>
      <div class="chips" style="margin-bottom:14px">
        <button onclick="window.open('https://search.bilibili.com/all?keyword='+encodeURIComponent('信息素养 微课'),'_blank')">🔍 B站搜「信息素养 微课」</button>
        <button onclick="window.open('https://www.icourse163.org/search.htm?search='+encodeURIComponent('信息检索'),'_blank')">🔍 MOOC搜「信息检索」</button>
        <button onclick="window.open('https://higher.smartedu.cn/','_blank')">🔍 国家智慧教育平台</button>
      </div>
      <div class="vgrid" id="vgrid"></div>
      <div class="note">外链资源版权归原平台与作者所有，仅供学习使用。如学校有自制微课，可在页面源码 VIDEOS 数组处替换。</div>
    </div>
  </section>

  <footer>
    信息素养 AI 学伴 v6 ｜ AI 答疑 + 题库练习 + 微课资源 ｜ 内容仅供教学参考
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
/* ==========================================================
   模型配置（已填好）
   PROVIDER：glm = 智谱 GLM-4-Flash（免费）
   换模型：把 PROVIDER 改成 'deepseek' 或 'doubao' 并填对应 Key/接入点
   ========================================================== */
var CONFIG={
  PROVIDER:'glm',
  API_KEY:'c71d054a181141e38a14fae31e5fc1b0.HKubalQhmKsS2D7D'
};
var PROVIDERS={
  glm:     {label:'智谱 GLM-4-Flash（免费）',base:'https://open.bigmodel.cn/api/paas/v4',model:'glm-4-flash'},
  doubao:  {label:'豆包 · 火山方舟',base:'https://ark.cn-beijing.volces.com/api/v3',model:'在这里填你的接入点ID(ep-开头)'},
  deepseek:{label:'DeepSeek（按量付费）',base:'https://api.deepseek.com/v1',model:'deepseek-chat'}
};

/* ==================== 内置知识库（10个主题） ==================== */
var KB=[
{t:'信息素养概念与框架',k:'信息素养 信息素质 ACRL 框架 信息意识 信息能力 信息道德 概念 定义 素养',
 c:'信息素养（Information Literacy）：1974年美国信息产业协会主席保罗·泽考斯基首次提出，指个人"能认识到何时需要信息，并能有效检索、评估和使用信息"的能力。国内通常从信息意识、信息知识、信息能力、信息道德四个方面界定。2016年ACRL《高等教育信息素养框架》提出6个阈概念：权威的构建性与情境性、信息创造的过程性、信息的价值属性、探究式研究、对话式学术研究、战略探索式检索。高职学生培养重点：会用图书馆、会检索数据库、会评价信息、会规范引用。'},
{t:'文献类型与文献等级',k:'一次文献 二次文献 三次文献 零次文献 文献类型 期刊 专利 标准 综述 文摘 索引',
 c:'零次文献：未经正式发表的原始记录（手稿、课堂笔记、会议交流资料）。一次文献：原始研究成果（期刊论文、学位论文、专利说明书、会议论文、研究报告）。二次文献：对一次文献加工整理的检索工具（目录、索引、文摘、题录）。三次文献：综合提炼产品（综述、述评、百科全书、年鉴、教材）。GB/T 7714文献类型代码：[J]期刊 [M]专著 [D]学位论文 [C]会议论文 [P]专利 [S]标准 [R]报告 [EB/OL]电子资源。'},
{t:'布尔检索与检索算符',k:'布尔 AND OR NOT 检索式 算符 截词 精确检索 字段 查全率 查准率',
 c:'AND(与)：各词同时出现，缩小范围、提高查准率；OR(或)：任一出现，扩大范围、提高查全率；NOT(非)：排除。运算优先级通常NOT>AND>OR，可用括号改变。截词符*匹配任意字符串（comput*可匹配computer、computing），?匹配单字符。双引号"..."精确匹配词组。常用字段代码：题名TI、关键词KY、作者AU、单位AF、摘要AB。查全率=检出的相关文献量÷系统中相关文献总量；查准率=检出的相关文献量÷检出的文献总量；二者常互逆。'},
{t:'搜索引擎高级技巧',k:'搜索引擎 site filetype 高级搜索 技巧 百度 谷歌 检索指令 判断真假 网络信息',
 c:'site:域名——限定网站内检索（如 site:edu.cn 信息素养，只搜教育类网站）；filetype:pdf——限定文件类型（也支持ppt/doc/xls）；双引号"词组"——精确匹配；减号-词——排除；intitle:词——标题含该词。评价网络信息质量看四性：权威性（谁发布的？）、准确性（有无依据？）、客观性（有无偏见？）、时效性（何时发布？）。优先使用政府(.gov.cn)、教育(.edu.cn)、图书馆、权威媒体的信息。'},
{t:'知网（CNKI）使用指南',k:'知网 CNKI 中国知网 期刊 学位论文 高级检索 篇名 主题 下载 CAJ 导出参考文献',
 c:'入口：学校图书馆网站→数据库导航→中国知网（校园网内IP自动登录；校外用学校VPN或CARSI登录）。检索方式：①一框式检索——首页直接输词；②高级检索——限定篇名/关键词/主题/作者/单位，用AND/OR/NOT组合，限定时间与来源类别（核心期刊、CSSCI）；③结果左侧按学科、年份、来源筛选；④点文章下载CAJ或PDF（需学校已购买该库）；⑤勾选文献后点"导出与分析"可一键导出GB/T 7714格式参考文献。注意：篇名检索最精准，主题检索（篇名+关键词+摘要）范围大。个人免费替代渠道：国家哲学社会科学文献中心、国家科技图书文献中心(NSTL)等。'},
{t:'万方与维普',k:'万方 维普 数据库 会议论文 专利 科技 期刊 检索',
 c:'万方数据：以期刊、学位论文、会议论文、专利、标准、科技成果见长，会议论文和科技类文献较全。维普：期刊收录量大，以自然科学、工程技术期刊为主，回溯年代较深。三个中文库（知网/万方/维普）互有重叠但不完全相同，正式查某一主题建议三个库都查，避免漏检。使用方式与知网类似：高级检索+字段限定+时间限定。学校未购买的库，可通过图书馆文献传递或馆际互借获取原文。'},
{t:'文献检索策略与步骤',k:'检索策略 检索步骤 课题 选词 检索词 同义词 文献调研 太多 太少 漏检',
 c:'六步法：①分析课题——明确主题概念、目的、范围、语种、年限；②选检索词——同义词、近义词、上下位词、中英文、缩写与全称（如"信息素养"≈"信息素质"≈Information Literacy）；③选数据库——中文用知网/万方/维普，外文用Web of Science等；④构造检索式——AND/OR/NOT组合；⑤检索与调整——结果太多：加限定词、限篇名字段、限时间/来源；结果太少：换上位词、用OR加同义词、放宽字段；⑥获取原文——直接下载或文献传递。实例：查"高职学生信息素养现状"，检索式：(信息素养 OR 信息素质) AND (高职 OR 大专) AND (现状 OR 调查)。'},
{t:'学术规范与引用格式',k:'参考文献 引用 格式 GB/T7714 学术不端 抄袭 引用格式 著录 标注',
 c:'参考文献著录执行国家标准GB/T 7714-2015。示例：期刊——作者.题名[J].刊名,年,卷(期):页码.；专著——作者.书名[M].版次.出版地:出版社,出版年:页码.；学位论文——作者.题名[D].保存地:保存单位,年份.；电子资源——作者.题名[EB/OL].(发布日期)[引用日期].网址.。正文标注可用顺序编码制[1]（按出现顺序编号）。学术不端包括：抄袭剽窃、伪造篡改数据、一稿多投、不当署名、买卖论文。避免抄袭三原则：直接引用加引号并注明出处；转述改写也要注明来源；引用比例适度。'},
{t:'图书馆资源与服务',k:'图书馆 OPAC 索书号 中图法 馆藏 借阅 参考咨询 馆际互借 图书馆服务 开馆',
 c:'馆藏查询用OPAC（联机公共目录查询系统），可查馆藏地点、索书号、借阅状态并可续借。中国图书馆分类法22个基本大类：G文化科学教育体育、H语言文字、I文学、K历史地理、O数理化学、R医药卫生、T工业技术（TP计算机）。索书号=分类号+书次号，按号排架找书。图书馆常见服务：参考咨询（找资料、定课题可咨询馆员）、馆际互借/文献传递、信息素养培训讲座、电子资源校外访问。借阅超期按本馆规定处理（逾期费或暂停借阅）。具体开馆时间、借阅册数、校外访问方式请以本校图书馆网站和公众号公布为准。'},
{t:'常见FAQ',k:'怎么查文献 怎么找 找不到 全文 免费 下载 论文怎么查 FAQ 文献太多 文献太少 求助',

function kbTop(q,n){
  var scored=KB.map(function(e,i){
    var s=0;
    e.k.split(' ').forEach(function(kw){
      if(!kw)return;
      var m=q.match(new RegExp(kw,'g'));
      if(m)s+=m.length*(kw.length>=4?3:1);
    });
    return {i:i,s:s};
  });
  scored.sort(function(a,b){return b.s-a.s;});
  var picked=scored.filter(function(x){return x.s>0;}).slice(0,n||2);
  if(picked.length===0)picked=[{i:9}];
  return picked;
}
function kbText(q,n){
  return kbTop(q,n).map(function(x){var e=KB[x.i];return '【主题：'+e.t+'】\n'+e.c;}).join('\n\n');
}

function aiStream(systemContent,history){
  return new Promise(function(resolve,reject){
    var p=currentProvider();
    var ctl=new AbortController();
    var timer=setTimeout(function(){ctl.abort();},120000);
    fetch(p.base.replace(/\/+$/,'')+'/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+CONFIG.API_KEY.trim()},
      body:JSON.stringify({model:p.model,messages:[{role:'system',content:systemContent}].concat(history),temperature:0.7,max_tokens:800,stream:true}),
      signal:ctl.signal
    }).then(function(res){
      if(!res.ok){return res.text().then(function(t){throw new Error('HTTP '+res.status+' '+t.slice(0,120));});}
      var reader=res.body.getReader(),dec=new TextDecoder(),buf='',full='';
      function pump(){
        return reader.read().then(function(r){
          if(r.done){clearTimeout(timer);resolve(full);return;}
          buf+=dec.decode(r.value,{stream:true});
          var lines=buf.split('\n');buf=lines.pop();
          for(var i=0;i<lines.length;i++){
            var line=lines[i].trim();
            if(line.indexOf('data:')!==0)continue;
            var pl=line.slice(5).trim();
            if(pl==='[DONE]')continue;
            try{
              var j=JSON.parse(pl);
              var d=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;
              if(d)full+=d;
            }catch(e){}
          }
          return pump();
        });
      }
      return pump();
    }).catch(function(e){clearTimeout(timer);reject(e);});
  });
}

function aiPlain(systemContent,history){
  var p=currentProvider();
  var ctl=new AbortController();
  var timer=setTimeout(function(){ctl.abort();},90000);
  return fetch(p.base.replace(/\/+$/,'')+'/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+CONFIG.API_KEY.trim()},
    body:JSON.stringify({model:p.model,messages:[{role:'system',content:systemContent}].concat(history),temperature:0.7,max_tokens:800,stream:false}),
    signal:ctl.signal
  }).then(function(res){
    clearTimeout(timer);
    return res.json().then(function(j){
      if(!res.ok)throw new Error('HTTP '+res.status+' '+(j.error&&j.error.message||''));
      var c=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
      if(!c||!c.trim())throw new Error('empty');
      return c;
    });
  }).catch(function(e){clearTimeout(timer);throw e;});
}

function offlineAnswer(q){
  var t=q.trim();
  if(/^(你好|您好|hi|hello|哈喽|在吗)/i.test(t)){
    return '你好！我是信息素养 AI 助教。当前 AI 模型暂时不可用，我正在用内置知识库回答。你可以问我：什么是信息素养？怎么在知网查文献？参考文献格式怎么写？';
  }
  if(/谢谢|感谢/.test(t))return '不客气！还有其他问题随时问。';
  var top=kbTop(t,1)[0];
  var e=KB[top.i];
  return '【离线知识库 · '+e.t+'】\n'+e.c+'\n\n（当前 AI 模型不可用或额度用尽，以上内容来自内置知识库。Key 恢复/充值后自动回到 AI 在线回答。）';
}

var CHAT_HISTORY=storeGet('il_chat')||[];
function renderWelcome(){
  return '<div class="msg ai">你好！我是<b>信息素养 AI 助教</b>，可以直接提问。我能解答：信息素养概念、信息检索方法、数据库使用、文献引用格式、图书馆利用等问题。回答仅供学习参考。</div>';
}
function renderChat(){
  var box=$('messages');box.innerHTML=renderWelcome();
  CHAT_HISTORY.forEach(function(m){
    var d=document.createElement('div');
    if(m.role==='user'){d.className='msg user';d.textContent=m.content;}
    else if(m.role==='offline'){d.className='msg off';d.innerHTML=mdToHtml(m.content);}
    else{d.className='msg ai';d.innerHTML=mdToHtml(m.content);}
    box.appendChild(d);
  });
  box.scrollTop=box.scrollHeight;
}
function mdToHtml(s){
  var h=esc(s);
  h=h.replace(/```([\s\S]*?)```/g,function(m,c){return '<pre><code>'+c.replace(/^\n|\n$/g,'')+'</code></pre>';});
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  h=h.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/^#{1,3}\s+(.*)$/gm,'<h4>$1</h4>');
  h=h.replace(/^\s*[-*]\s+(.*)$/gm,'• $1');
  h=h.replace(/\n/g,'<br>');
  return h;
}

async function sendChat(text){
  var input=$('chatInput');
  var t=(text!==undefined?text:input.value.trim());
  if(!t)return;
  input.value='';
  var box=$('messages');
  var u=document.createElement('div');u.className='msg user';u.textContent=t;box.appendChild(u);
  box.scrollTop=box.scrollHeight;
  CHAT_HISTORY.push({role:'user',content:t});
  var bubble=document.createElement('div');bubble.className='msg ai';
  bubble.innerHTML='<span class="typing">正在思考</span>';
  box.appendChild(bubble);box.scrollTop=box.scrollHeight;
  $('sendBtn').disabled=true;

  var kb=kbText(t,2);
  var history=CHAT_HISTORY.slice(-30);
  var sys=DEFAULT_PROMPT+'\n\n【知识库资料】\n'+kb;
  var answer='',mode='online';

  if(keyOk()){
    try{
      answer=await aiStream(sys,history);
      if(!answer||!answer.trim())throw new Error('empty');
    }catch(e1){
      try{
        answer=await aiPlain(sys,history);
      }catch(e2){
        answer=offlineAnswer(t);
        mode='offline';
      }
    }
  }else{
    answer=offlineAnswer(t);
    mode='offline';
  }

  if(mode==='offline'){bubble.className='msg off';setModeTag('离线知识库模式',true);}
  else{setModeTag(currentProvider().label,false);}
  bubble.innerHTML=mdToHtml(answer);
  CHAT_HISTORY.push({role:mode==='offline'?'offline':'assistant',content:answer});
  if(CHAT_HISTORY.length>40)CHAT_HISTORY=CHAT_HISTORY.slice(-40);
  storeSet('il_chat',CHAT_HISTORY);
  $('sendBtn').disabled=false;
  box.scrollTop=box.scrollHeight;
}
$('sendBtn').addEventListener('click',function(){sendChat();});
$('chatInput').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}
});
document.querySelectorAll('#quickChips button').forEach(function(b){
  b.addEventListener('click',function(){sendChat(b.textContent);});
});

/* ==================== 题库练习 ==================== */
var CATS={all:'全部',base:'信息素养基础',search:'信息检索',lib:'图书馆知识'};
var quiz={cat:'all',mode:'seq',list:[],idx:0,score:0,answered:false,marked:[]};
var wrongIds=storeGet('il_wrong_ids')||[];
var stats=storeGet('il_stats')||{total:0,correct:0};
function saveWrong(){storeSet('il_wrong_ids',wrongIds);}
function saveStats(){storeSet('il_stats',stats);}
function updateStatsText(){
  $('statsText').textContent='（累计答题 '+stats.total+' 题，正确 '+stats.correct+' 题，错题本 '+wrongIds.length+' 道）';
}
function pickList(){
  var pool=QUESTIONS.filter(function(q){return quiz.cat==='all'||q.cat===quiz.cat;});
  if(quiz.mode==='rand'){
    var arr=pool.slice();
    for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;}
    return arr.slice(0,10);
  }
  if(quiz.mode==='wrong')return QUESTIONS.filter(function(q){return wrongIds.indexOf(q.id)>-1;});
  return pool;
}
function startQuiz(){
  quiz.list=pickList();quiz.idx=0;quiz.score=0;quiz.answered=false;
  quiz.marked=quiz.list.map(function(){return null;});
  if(quiz.list.length===0){
    $('quizBody').innerHTML='<div class="summary"><div class="score">🎉</div><p>当前没有错题（或该分类暂无题目）。</p><div class="ctrl" style="justify-content:center"><button class="btn-main" onclick="startQuiz()">返回练习</button></div></div>';
    return;
  }
  renderQuestion();
}
function renderQuestion(){
  var q=quiz.list[quiz.idx];quiz.answered=false;
  var total=quiz.list.length;
  var html='<div class="qmeta"><span>'+CATS[q.cat]+' · 第 '+(quiz.idx+1)+' / '+total+' 题</span><span>得分：'+quiz.score+'</span></div>';
  html+='<div class="qtext">'+esc(q.q)+'</div><div class="opts">';
  q.o.forEach(function(o,i){
    html+='<button class="opt" data-i="'+i+'"><span class="letter">'+String.fromCharCode(65+i)+'</span>'+esc(o)+'</button>';
  });
  html+='</div><div class="explain" id="explain"></div>';
  html+='<div class="ctrl"><button class="btn-ghost" id="quitBtn">结束练习</button><button class="btn-main" id="nextBtn" style="display:none">'+(quiz.idx+1<total?'下一题':'查看成绩')+'</button></div>';
  $('quizBody').innerHTML=html;
  document.querySelectorAll('#quizBody .opt').forEach(function(btn){
    btn.addEventListener('click',function(){choose(parseInt(btn.dataset.i,10));});
  });
  $('quitBtn').addEventListener('click',function(){renderSummary(true);});
  $('nextBtn').addEventListener('click',function(){
    quiz.idx++;
    if(quiz.idx<quiz.list.length)renderQuestion();
    else renderSummary(false);
  });
}
function choose(i){
  if(quiz.answered)return;
  quiz.answered=true;
  var q=quiz.list[quiz.idx];
  var right=(i===q.a);
  quiz.marked[quiz.idx]=right;
  stats.total++;if(right)stats.correct++;
  saveStats();
  var btns=document.querySelectorAll('#quizBody .opt');
  btns.forEach(function(b){b.disabled=true;});
  var ex=$('explain');
  if(right){
    quiz.score++;
    btns[i].classList.add('correct');
    ex.className='explain right';ex.innerHTML='✅ 回答正确。'+esc(q.e);
  }else{
    btns[i].classList.add('wrong');
    btns[q.a].classList.add('correct');
    if(wrongIds.indexOf(q.id)===-1){wrongIds.push(q.id);saveWrong();}
    ex.className='explain wrong';ex.innerHTML='❌ 回答错误。正确答案：<b>'+String.fromCharCode(65+q.a)+'</b>。'+esc(q.e);
  }
  ex.style.display='block';
  $('nextBtn').style.display='inline-block';
  updateStatsText();
}
function renderSummary(quit){
  if(quit){
    $('quizBody').innerHTML='<div class="summary"><div class="score">练习已结束</div><p>本次已完成 '+quiz.idx+' 题</p><div class="ctrl" style="justify-content:center"><button class="btn-main" onclick="startQuiz()">重新开始</button></div></div>';
    updateStatsText();return;
  }
  var total=quiz.list.length,score=quiz.score;
  var rate=total?Math.round(score/total*100):0;
  var html='<div class="summary"><div class="score">'+score+' / '+total+'</div><p>正确率 '+rate+'%</p>';
  html+='<div class="review">';
  quiz.list.forEach(function(q,idx){
    var ok=quiz.marked[idx];
    html+='<div class="rq"><b>'+(idx+1)+'.</b> '+esc(q.q)+'<br><span class="'+(ok?'okc':'badc')+'">'+(ok?'✅ 答对':'❌ 答错')+'</span>　正确答案：'+String.fromCharCode(65+q.a)+' · '+esc(q.o[q.a])+'</div>';
  });
  html+='</div>';
  html+='<div class="ctrl" style="justify-content:center;margin-top:16px"><button class="btn-main" onclick="startQuiz()">再来一轮</button><button class="btn-ghost" onclick="clearWrong()">清空错题本</button></div></div>';
  $('quizBody').innerHTML=html;
  updateStatsText();
}
function clearWrong(){wrongIds=[];saveWrong();toast('错题本已清空');updateStatsText();}
document.querySelectorAll('.catbtn').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.catbtn').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active');quiz.cat=b.dataset.cat;startQuiz();
  });
});
document.querySelectorAll('.modebtn').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.modebtn').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active');quiz.mode=b.dataset.mode;startQuiz();
  });
});
